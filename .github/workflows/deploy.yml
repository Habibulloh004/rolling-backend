name: Deploy to VPS

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail

          HOST="$(echo '${{ secrets.SSH_HOST }}' | tr -d ' \t\r\n')"
          PORT="$(echo '${{ secrets.SSH_PORT }}' | tr -d ' \t\r\n')"
          USER="$(echo '${{ secrets.SSH_USER }}' | tr -d ' \t\r\n')"

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

          ssh -T \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            -p "$PORT" \
            "${USER}@${HOST}" << 'EOF'
          set -e
          cd /opt/server/rolling-backend
          git fetch --all
          git reset --hard origin/main

          docker compose up -d postgres

          echo "Waiting for postgres to be ready..."
          attempts=0
          while ! docker exec rolling_postgres pg_isready -U postgres -d rolling >/dev/null 2>&1; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 30 ]; then
              echo "Postgres did not become ready in time"
              exit 1
            fi
            sleep 2
          done

          migrations_dir="migrations"
          if [ -d "$migrations_dir" ]; then
            echo "Checking migrations in $migrations_dir"
            docker exec rolling_postgres psql -U postgres -d rolling -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (id SERIAL PRIMARY KEY, migration_name VARCHAR(255) NOT NULL UNIQUE, applied_at TIMESTAMP NOT NULL DEFAULT NOW()); CREATE INDEX IF NOT EXISTS idx_migration_name ON schema_migrations(migration_name);"

            migration_files=$(find "$migrations_dir" -maxdepth 1 -type f -name '*.sql' | sort)
            if [ -z "$migration_files" ]; then
              echo "No migration files found"
            else
              for migration_file in $migration_files; do
                migration_name=$(basename "$migration_file")
                sql_migration_name=${migration_name//\'/\'\'}
                case "$migration_name" in
                  00_*) continue ;;
                esac

                applied=$(docker exec rolling_postgres psql -U postgres -d rolling -tA -v ON_ERROR_STOP=1 -c "SELECT 1 FROM schema_migrations WHERE migration_name = '$sql_migration_name' LIMIT 1;")
                if [ "$applied" = "1" ]; then
                  echo "Migration $migration_name already applied, skipping"
                  continue
                fi

                echo "Applying migration $migration_name"
                docker exec -i rolling_postgres psql -U postgres -d rolling -v ON_ERROR_STOP=1 < "$migration_file"
                docker exec rolling_postgres psql -U postgres -d rolling -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migrations (migration_name) VALUES ('$sql_migration_name');"
              done
            fi
          else
            echo "Migrations directory not found, skipping"
          fi

          docker compose up -d --build
          docker ps
          EOF
